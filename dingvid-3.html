<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vjdeyhub</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#fff;
    color:#111;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    border-bottom:1px solid #eee;
    position:sticky;
    top:0;
    background:#fff;
    z-index:100;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.upload{
    background:#0d1b2a;
    color:#fff;
    padding:8px 16px;
    border-radius:20px;
    font-size:14px;
}

.container{
    max-width:700px;
    margin:auto;
    padding:10px;
}

/* TELEGRAM */
.telegram-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    margin:10px 0 22px;
    padding:14px;
    border-radius:12px;
    background:#229ED9;
    color:#fff;
    text-decoration:none;
    font-size:15px;
    font-weight:bold;
}

.telegram-btn svg{
    width:21px;
    height:21px;
    fill:currentColor;
}

.card{
    margin-bottom:22px;
}

video{
    width:100%;
    display:block;
    border-radius:14px;
    background:#000;
}

.title{
    font-weight:bold;
    margin-top:8px;
    font-size:16px;
}

.meta{
    color:#666;
    font-size:13px;
    margin-top:4px;
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">viideyhub</div>
    <div class="upload">Upload</div>
</div>

<div class="container">

<a class="telegram-btn"
   href="https://t.me/mediaviralweb"
   target="_blank"
   rel="noopener noreferrer">
    <svg viewBox="0 0 24 24">
        <path d="M21.8 4.2 18.5 20c-.25 1.1-.9 1.35-1.8.85l-5-3.7-2.4 2.3c-.25.25-.5.45-1 .45l.35-5.1 9.3-8.4c.4-.35-.1-.55-.6-.2L6 13.5 1.1 12c-1.05-.3-1.05-1 .2-1.5L20.4 3c.9-.35 1.7.2 1.4 1.2z"/>
    </svg>
    JOIN CHANNEL TELEGRAM
</a>

<div class="card">
    <video controls playsinline preload="metadata"
    src="https://cdn2.videy.co/mAuiBCqS1.mp4"></video>
    <div class="title">🔥 Video Viral #1</div>
    <div class="meta">Trending sekarang</div>
</div>

<div class="card">
    <video controls playsinline preload="metadata"
    src="https://cdn2.videy.co/0j0rNDsI1.mp4"></video>
    <div class="title">🔥 Video Viral #2</div>
    <div class="meta">Trending sekarang</div>
</div>

<div class="card">
    <video controls playsinline preload="metadata"
    src="https://cdn2.videy.co/PyBXTjkI1.mp4"></video>
    <div class="title">🔥 Video Viral #3</div>
    <div class="meta">Trending sekarang</div>
</div>

<div class="card">
    <video controls playsinline preload="metadata"
    src="https://cdn2.slicedrive.com/Wn9AWU0a1.mp4"></video>
    <div class="title">🔥 Video Viral #4</div>
    <div class="meta">Trending sekarang</div>
</div>

<div class="card">
    <video controls playsinline preload="metadata"
    src="https://cdn2.slicedrive.com/xP8zZHI01.mp4"></video>
    <div class="title">🔥 Video Viral #5</div>
    <div class="meta">Trending sekarang</div>
</div>

</div>

<script>
"use strict";

const DIRECT_LINK = "https://uplcm.com/4/12201714";

let smartlinkOpened = false;

/* DIRECT LINK SAAT KLIK VIDEO */
document.querySelectorAll("video").forEach(video => {
    video.addEventListener("click", () => {
        if (!smartlinkOpened) {
            smartlinkOpened = true;
            window.open(DIRECT_LINK, "_blank");
        }
    });
});

/* POPUNDER */
(function(s){
    s.dataset.zone = '12201715';
    s.src = 'https://al5sm.com/tag.min.js';
})(
    [document.documentElement, document.body]
    .filter(Boolean)
    .pop()
    .appendChild(document.createElement('script'))
);
</script>

</body>
</html>
